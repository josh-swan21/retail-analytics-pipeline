<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="28" fill="#0F172A"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="90" y="120" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#F8FAFC">Duplicates are not always the same</text>
  <text x="90" y="162" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#CBD5E1">A simple visual for the “same pattern, different meaning” idea</text>

  <rect x="90" y="220" width="300" height="240" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="150" cy="280" r="30" fill="#38BDF8"/>
  <text x="205" y="275" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Customers</text>
  <text x="145" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E2E8F0">Repeated rows can</text>
  <text x="145" y="365" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E2E8F0">mean multiple</text>
  <text x="145" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E2E8F0">addresses or contacts</text>

  <rect x="450" y="220" width="300" height="240" rx="20" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
  <circle cx="510" cy="280" r="30" fill="#34D399"/>
  <text x="565" y="275" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Orders</text>
  <text x="505" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E2E8F0">Repeated rows can</text>
  <text x="505" y="365" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E2E8F0">reflect line-item</text>
  <text x="505" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E2E8F0">expansion</text>

  <rect x="810" y="220" width="300" height="240" rx="20" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="870" cy="280" r="30" fill="#F59E0B"/>
  <text x="925" y="275" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Inventory</text>
  <text x="865" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E2E8F0">Repeated rows can</text>
  <text x="865" y="365" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E2E8F0">signal different</text>
  <text x="865" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#E2E8F0">locations or contexts</text>

  <rect x="300" y="500" width="600" height="54" rx="27" fill="#1D4ED8"/>
  <text x="345" y="536" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Same shape. Different business meaning.</text>
</svg>
