version: 2
sources:
  - name: retail_core
    database: RETAIL_DB
    schema: CORE
    description: Validated current Shopify snapshot published by retail_batch.
    tables:
      - name: orders
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: created_at
            data_tests: [not_null]
          - name: is_test
            data_tests: [not_null]
          - name: order_total_currency
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['USD']
      - name: order_lines
        columns:
          - name: order_line_id
            data_tests: [not_null, unique]
          - name: order_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('retail_core', 'orders')
                    field: order_id
          - name: quantity
            data_tests: [not_null]
